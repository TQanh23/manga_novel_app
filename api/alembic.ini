[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
# Sequential revision ids: pass --rev-id with the next number.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60
# The database URL comes from MIGRATION_DATABASE_URL (see migrations/env.py).

[post_write_hooks]
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
