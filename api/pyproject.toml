[project]
name = "manga-novel-api"
version = "0.1.0"
description = "FastAPI monolith for the manga and novel reading platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "arq>=0.26",
    "asyncpg>=0.30",
    "boto3>=1.43",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "nh3>=0.3.7",
    "prometheus-client>=0.21",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "redis>=5.2,<6",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "uuid-utils>=0.10",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "moto[s3]>=5.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "testcontainers>=4.9",
    "types-boto3[s3]>=1.43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--import-mode=importlib"
testpaths = ["api", "tests"]

[tool.coverage.run]
source = ["api"]
branch = true
# SQLAlchemy's async layer runs on greenlets and argon2 on threads; without
# these, lines after an awaited database call are reported as never run.
concurrency = ["greenlet", "thread"]
omit = ["*/tests/*", "api/testing.py"]
