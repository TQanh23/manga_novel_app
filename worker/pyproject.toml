[project]
name = "manga-novel-worker"
version = "0.1.0"
description = "arq worker for slow and scheduled work"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arq>=0.26",
    "manga-novel-api",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.uv.sources]
manga-novel-api = { workspace = true }

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--import-mode=importlib"
testpaths = ["worker"]
