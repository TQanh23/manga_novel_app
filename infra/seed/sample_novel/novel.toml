# The sample novel the seed script publishes for author@example.com.
#
# Written for this project, so the work is marked is_sample: it may be sent to
# AI providers that real manuscripts never reach, and it is the base of the
# eval set. The text here is consistent. Planted contradictions belong in the
# copies under eval/, never here.
#
# Every fact in the glossary is stated in at least two chapters.

title = "Người Giữ Đèn Bến Sương"
synopsis = "Ở Bến Sương, một ngọn đèn ánh lam trên đỉnh tháp dẫn thuyền qua sương mù. An Nhiên, mười bảy tuổi, học việc giữ đèn và mang theo chiếc la bàn đồng của người mẹ mất tích. Khi một thương nhân từ Kinh Lạc tới hỏi mua dầu thắp đèn, chiếc la bàn bắt đầu chỉ sai hướng."
language = "vi"
genres = ["fantasy", "mystery"]
tags = ["Kỳ ảo", "Phiêu lưu", "Bến sông"]

# One per chapter file, in order: 01.md, 02.md, ...
episodes = [
    "Một trăm lẻ tám bậc",
    "Người khách từ Kinh Lạc",
    "Chiếc la bàn chỉ sai hướng",
    "Đêm không có ánh lam",
    "Ánh đèn gọi người về",
]

